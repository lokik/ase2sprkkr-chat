name: tests

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
      - 'tmp-**'

jobs:
  build:
    # Python 3.8/3.9 builds are unavailable for Ubuntu 26.04.
    runs-on: ${{ (matrix.python-version == '3.8' || matrix.python-version == '3.9') && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: |
         mkdir -p ~/.config/matplotlib
         echo "text.usetex : False" >> ~/.config/matplotlib/matplotlibrc
    - run: ./install_dependencies.sh
    - run: DO_NOT_RUN_SPRKKR=1 ./run_tests
